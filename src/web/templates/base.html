<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}投研百科{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body data-page="{% block page %}{% endblock %}">
<header class="topbar">
  <div class="brand"><a href="/">投研百科</a><span class="sub">句句标注出处的研报知识库</span></div>
  <nav id="main-nav">
    <a href="/" data-nav="home">首页</a>
    <a href="/ask" data-nav="ask">问答</a>
    <a href="/kb" data-nav="kb">知识库</a>
    <a href="/ingest" data-nav="ingest">摄入</a>
    <a href="/audit" data-nav="audit">审校</a>
    <a href="/outputs" data-nav="outputs">产出</a>
    <a href="/log" data-nav="log">日志</a>
    <span id="task-badge" class="task-badge" hidden title="有任务正在后台运行"></span>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer>投研百科 · 本地单机 · 数据在 raw/ 与 wiki/ 目录</footer>

<div class="modal-backdrop" id="extract-modal" hidden>
  <div class="modal">
    <div class="modal-head">
      <b>提取新知识进知识库</b>
      <button class="icon-btn" data-close="extract-modal" title="关闭">✕</button>
    </div>
    <p class="modal-note muted" id="extract-note"></p>
    <div class="modal-body" id="extract-body"></div>
    <div class="modal-foot">
      <button class="ghost" id="extract-later">稍后处理</button>
      <button class="primary" id="extract-confirm">确认提取</button>
    </div>
  </div>
</div>

<div id="toast-wrap"></div>
<script src="{{ url_for('static', filename='app.js') }}" defer></script>
{% block scripts %}{% endblock %}
</body>
</html>
