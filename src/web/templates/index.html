{% extends "base.html" %}
{% block title %}首页 · 投研百科{% endblock %}
{% block page %}home{% endblock %}
{% block content %}
<section class="hero">
  <h1>投研百科</h1>
  <p class="tagline">把研报读薄，把出处留住</p>
  <form id="home-ask" class="ask-box">
    <input id="home-q" type="text" placeholder="输入您的问题或要求" autocomplete="off">
    <select id="model-select" class="model-select" title="选择回答用的大模型" aria-label="选择回答用的大模型">
      {% for m in MODEL_CHOICES %}
      <option value="{{ m.id }}"{% if m.id == DEFAULT_MODEL %} selected{% endif %}>{{ m.label }}</option>
      {% endfor %}
    </select>
    <button type="submit" class="primary">提问</button>
  </form>
</section>

<section class="dropzone-zone">
  <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="添加文件">
    <div class="dz-plus">＋</div>
    <div class="dz-text">把文件拖进这里，或点击添加</div>
    <div class="dz-sub muted">支持 PDF 与 Word（.docx），可一次多份</div>
  </div>
  <input type="file" id="file-input" accept=".pdf,.docx" multiple hidden>
  <p class="muted" id="upload-hint"></p>
  <div id="task-area" class="task-area"></div>
</section>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='home.js') }}" defer></script>{% endblock %}
