{% extends "base.html" %}
{% block title %}收件台 · 研报百科{% endblock %}
{% block content %}
<div class="narrow">
  <h1>收件台</h1>
  <p class="muted">把 PDF 拖进下面虚线框（或点击选择文件）。文件先存入 raw/inbox/，再由模型阅读开头几页判断类型、重命名并移入 raw/ 对应目录。每份约需十几秒。</p>
  <div id="dropzone">
    <p>把 PDF 拖到这里，或</p>
    <label class="primary">选择文件<input type="file" id="file-input" accept="application/pdf" multiple hidden></label>
  </div>
  <div id="upload-progress" hidden>处理中，请稍候…</div>
  <div id="upload-results"></div>
  <p><a href="/ingest">归类完成后，去摄入页编译入库 →</a></p>
</div>
{% endblock %}
