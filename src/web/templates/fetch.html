{% extends "base.html" %}
{% block title %}取数 · 行业知识库{% endblock %}
{% block page %}fetch{% endblock %}
{% block content %}
<div class="narrow">
  <div class="page-head">
    <h1>主动取数</h1>
    <button class="primary" id="fetch-run">开始取数</button>
  </div>
  <p class="muted">免登录源自动取数。统计局与 AKShare 序列落成快照 DOCX 再摄入，东财研报与巨潮公告下载后自动取名入库。慧博只用免登录榜单，发现报告积分等登录墙不自动碰，请手动上传或到会话里派资料员。</p>
  <div class="fetch-form">
    <label class="muted" for="fetch-source">取数源</label>
    <select id="fetch-source"></select>
    <p class="hint" id="fetch-desc"></p>
    <div id="fetch-params" class="fetch-params"></div>
  </div>
  <div id="fetch-progress" class="task-area"></div>
  <div id="fetch-result"></div>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='fetch_page.js') }}" defer></script>{% endblock %}
