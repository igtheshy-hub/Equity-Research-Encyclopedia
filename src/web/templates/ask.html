{% extends "base.html" %}
{% block title %}问答 · 行业知识库{% endblock %}
{% block page %}ask{% endblock %}
{% block content %}
<div class="ask-layout">
  <div class="ask-toolbar">
    <span class="muted">提问后答案后台生成，切换页面不丢；答案句尾角标可点开原文对照。</span>
    <button class="ghost" id="split-toggle">添加会话窗口</button>
  </div>
  <div class="panes" id="panes">
    <section class="pane" data-pane="0"></section>
    <div class="vdivider" id="vdivider" hidden></div>
    <section class="pane" data-pane="1" hidden></section>
  </div>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='ask.js') }}" defer></script>{% endblock %}
