[project]
name = "research-wiki"
version = "0.1.0"
description = "团队百科：把券商研报 PDF 沉淀为句句标页码的可审可查知识库"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "sqlalchemy>=2.0,<3",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "anthropic>=0.39",
    "openai>=1.50",
    "pymupdf>=1.24",
    "pillow>=10.4",
    "jieba>=0.42",
    "numpy>=2.0",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ocr = ["paddleocr>=2.7"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[project.scripts]
research-wiki = "app.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
